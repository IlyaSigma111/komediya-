<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Божественная комедия | Данте Алигьери | Викторина</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', 'Times New Roman', serif;
            background: radial-gradient(circle at 30% 10%, #1a0f1a, #0a0510);
            color: #f5e6d3;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        /* глоу-сферы */
        .glow-sphere {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .sphere-1 { width: 55vw; height: 55vw; top: -30vh; left: -20vw; background: #8b3a62; }
        .sphere-2 { width: 50vw; height: 50vw; bottom: -30vh; right: -10vw; background: #3a2a5a; }
        .sphere-3 { width: 40vw; height: 40vw; top: 50%; left: 60%; background: #b87a3a; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* стеклянные карточки */
        .glass-card {
            background: rgba(30, 20, 40, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 215, 150, 0.2);
            border-radius: 2rem;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6d3, #e2b87a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .score-box {
            background: rgba(210, 150, 75, 0.25);
            border: 1px solid #e2b87a;
            border-radius: 2rem;
            padding: 0.3rem 1.2rem;
            font-weight: bold;
            display: inline-block;
        }

        .quiz-question {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            transition: 0.2s;
            border-left: 3px solid #e2b87a;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .q-num {
            background: #e2b87a;
            color: #1a0f1a;
            font-weight: bold;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .q-type {
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0.8rem 0;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 0.8rem 0;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 150, 0.3);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #f5e6d3;
        }
        .option-btn:hover:not(.disabled) {
            background: rgba(210, 150, 75, 0.2);
            transform: scale(0.96);
        }

        .feedback {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
        }
        .correct-feedback {
            border-left: 4px solid #b8860b;
            background: rgba(184, 134, 11, 0.1);
        }
        .wrong-feedback {
            border-left: 4px solid #8b3a62;
            background: rgba(139, 58, 98, 0.1);
        }

        .hint-btn {
            background: none;
            border: 1px dashed #e2b87a;
            border-radius: 2rem;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            cursor: pointer;
            color: #e2b87a;
        }
        .hint-text {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.6rem;
            border-radius: 1rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .hint-text.show { display: block; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 150, 0.3);
            border-radius: 2rem;
            padding: 0.6rem 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            color: #f5e6d3;
        }
        .btn-primary {
            background: #e2b87a;
            border-color: #e2b87a;
            color: #1a0f1a;
            font-weight: bold;
        }
        .btn-primary:hover { background: #c99f5a; transform: scale(0.96);}

        .progress {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .mode-screen {
            text-align: center;
            padding: 1.5rem;
        }
        .mode-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #4a2a5a;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            min-width: 180px;
            border: 1px solid #e2b87a;
        }

        @media (max-width: 650px) {
            body { padding: 1rem; }
            .question-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="glow-sphere sphere-1"></div>
<div class="glow-sphere sphere-2"></div>
<div class="glow-sphere sphere-3"></div>

<div class="container" id="mainApp"></div>

<script>
    // ========= 20 ВОПРОСОВ по «Божественной комедии» =========
    const QUESTIONS = [
        { text: "Сколько частей (кантик) в «Божественной комедии»?", options: ["2", "3", "4", "5"], correct: 1, hint: "Ад, Чистилище, Рай — 3 кантики." },
        { text: "Кто является проводником Данте в Раю?", options: ["Вергилий", "Беатриче", "Св. Бернард", "Катон"], correct: 1, hint: "Беатриче ведёт Данте по Раю, Вергилий — по Аду и Чистилищу." },
        { text: "Какой древнеримский поэт сопровождает Данте по Аду и Чистилищу?", options: ["Гомер", "Овидий", "Вергилий", "Гораций"], correct: 2, hint: "Вергилий — автор «Энеиды», символ разума." },
        { text: "Сколько кругов в Аду по Данте?", options: ["7", "8", "9", "10"], correct: 2, hint: "9 кругов — от Лимба до Ледяного озера." },
        { text: "Как звали возлюбленную Данте, ставшую главным символом Божественной любви в поэме?", options: ["Лаура", "Франческа", "Беатриче", "Луиза"], correct: 2, hint: "Беатриче Портинари — реальная женщина, воспетая Данте." },
        { text: "Какой грех наказывается в 5-м круге Ада (Стигийское болото)?", options: ["Гнев", "Чревоугодие", "Похоть", "Скупость"], correct: 0, hint: "Гневные и угрюмые томятся в болоте." },
        { text: "Кто находится в 9-м круге Ада (Ледяное озеро Коцит)?", options: ["Льстецы", "Предатели", "Еретики", "Ростовщики"], correct: 1, hint: "Джуда, Брут, Кассий — предатели, вмёрзшие в лёд." },
        { text: "Как называется река, разделяющая Ад и Чистилище?", options: ["Лета", "Стикс", "Ахерон", "Флегетон"], correct: 0, hint: "Лета — река забвения в Чистилище." },
        { text: "Какой трёхглавый демон стережёт 3-й круг Ада (чревоугодников)?", options: ["Минотавр", "Герион", "Цербер", "Плутос"], correct: 2, hint: "Цербер — пёс с тремя головами." },
        { text: "Кто из грешников обречён вечно вращаться в вихре (2-й круг) за грех похоти?", options: ["Франческа да Римини и Паоло", "Клеопатра", "Елена Прекрасная", "Семирамида"], correct: 0, hint: "Франческа и Паоло — знаменитая любовная история." },
        { text: "Какой стихотворный размер использует Данте в «Божественной комедии»?", options: ["Гекзаметр", "Терцины", "Сонет", "Белые стихи"], correct: 1, hint: "Терцины (три строки с перекрёстной рифмой) — его изобретение." },
        { text: "Что символизирует тёмный лес в начале поэмы?", options: ["Земную славу", "Греховное заблуждение", "Любовь к Беатриче", "Политику Флоренции"], correct: 1, hint: "Тёмный лес — метафора духовного кризиса и греха." },
        { text: "Кто был папой римским в период написания «Комедии» и подвергается критике Данте?", options: ["Бонифаций VIII", "Иннокентий III", "Григорий X", "Климент V"], correct: 0, hint: "Бонифаций VIII — враг Данте, помещён в Ад." },
        { text: "Как называются врата Ада, на которых написаны знаменитые строки «Оставь надежду, всяк сюда входящий»?", options: ["Врата Плутона", "Врата Лимба", "Врата Ада", "Врата Коцита"], correct: 2, hint: "Надпись на вратах Ада в 3-й песни." },
        { text: "Сколько небес в Раю по схеме Данте?", options: ["7", "8", "9", "10"], correct: 2, hint: "9 небес + Эмпирей." },
        { text: "Какой персонаж в Аду вмёрз в лёд и грызёт голову другому грешнику?", options: ["Граф Уголино", "Кассий", "Франческо", "Паоло"], correct: 0, hint: "Граф Уголино в 9-м круге грызёт архиепископа Руджери." },
        { text: "Что находится в центре Земли по Данте?", options: ["Чистилище", "Люцифер", "Райский сад", "Река Ахерон"], correct: 1, hint: "Люцифер (Вельзевул) вмёрз в центр Земли." },
        { text: "Кто из античных поэтов встречает Данте в Лимбе (1-й круг) вместе с Гомером?", options: ["Вергилий", "Овидий", "Гораций", "Лукан"], correct: 2, hint: "Гомер, Гораций, Овидий, Лукан — вместе с Вергилием." },
        { text: "Как называется третья кантика «Божественной комедии»?", options: ["Ад", "Чистилище", "Рай", "Райские сады"], correct: 2, hint: "«Рай» (Paradiso) — третья часть." },
        { text: "Какой геометрический символ часто связывают со структурой «Божественной комедии»?", options: ["Квадрат", "Спираль", "Троица (число 3)", "Крест"], correct: 2, hint: "3 кантики, 33 песни в каждой (плюс вводная), терцины — символ Троицы." }
    ];

    const TOTAL = QUESTIONS.length;
    let mode = null;              // 'screen' или 'paper'
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL).fill(null);
    let answerStatus = new Array(TOTAL).fill(false);
    let answered = new Array(TOTAL).fill(false);
    let quizFinished = false;
    let paperFinished = false;

    const appDiv = document.getElementById("mainApp");

    function updateScoreUI() {
        if (mode !== 'screen') return;
        const correctCount = answerStatus.filter(v => v === true).length;
        const scoreSpan = document.getElementById("scoreDisplay");
        if (scoreSpan) scoreSpan.innerText = `${correctCount} / ${TOTAL}`;
    }

    function evaluateQuestion(idx) {
        const selected = userAnswers[idx];
        if (selected === null) {
            answerStatus[idx] = false;
            return false;
        }
        const isCorrect = (selected === QUESTIONS[idx].correct);
        answerStatus[idx] = isCorrect;
        return isCorrect;
    }

    // ========== РЕЖИМ "НА ЭКРАНЕ" ==========
    function onSelectOption_Screen(optIndex) {
        if (quizFinished) return;
        if (answered[currentIndex]) return;
        userAnswers[currentIndex] = optIndex;
        evaluateQuestion(currentIndex);
        answered[currentIndex] = true;
        updateScoreUI();
        renderScreenQuestion();
    }

    function renderScreenQuestion() {
        if (quizFinished) {
            const correctTotal = answerStatus.filter(v => v === true).length;
            const percentage = Math.round(correctTotal / TOTAL * 100);
            let gradeMsg = "";
            if (percentage >= 85) gradeMsg = "🎉 Perfetto! Вы настоящий знаток «Божественной комедии»!";
            else if (percentage >= 65) gradeMsg = "📖 Хорошо! Перечитайте части про Ад и Рай.";
            else gradeMsg = "📚 Попробуйте ещё раз. Данте бы гордился вашим упорством!";

            let allItemsHtml = "";
            for (let i = 0; i < TOTAL; i++) {
                const q = QUESTIONS[i];
                const userChoice = userAnswers[i];
                const isUserCorrect = answerStatus[i];
                const correctText = q.options[q.correct];
                const userText = (userChoice !== null) ? q.options[userChoice] : "Нет ответа";
                allItemsHtml += `
                    <div style="background:rgba(0,0,0,0.3); border-radius:1rem; padding:0.8rem; margin-bottom:0.8rem;">
                        <strong>${i+1}. ${escapeHtml(q.text)}</strong><br>
                        <span style="color: ${isUserCorrect ? '#e2b87a' : '#8b3a62'};">${isUserCorrect ? '✅ Верно' : '❌ Ошибка'}</span><br>
                        <span>📖 Правильный ответ: ${escapeHtml(correctText)}</span><br>
                        ${!isUserCorrect ? `<span>✏️ Ваш ответ: ${escapeHtml(userText)}</span><br>` : ''}
                        <div style="font-size:13px; opacity:0.7; margin-top:5px;">💡 ${q.hint}</div>
                    </div>
                `;
            }

            const finalHtml = `
                <div class="glass-card" style="text-align:center;">
                    <div style="font-size:1.8rem; font-weight:800;">📜 РЕЗУЛЬТАТ</div>
                    <div style="background:rgba(0,0,0,0.3); border-radius:1.2rem; padding:1rem; margin:1rem 0;">
                        <span style="font-size:1.8rem; font-weight:800;">${correctTotal} / ${TOTAL}</span><br>${percentage}% — ${gradeMsg}
                    </div>
                    <div style="max-height:400px; overflow-y:auto;">${allItemsHtml}</div>
                    <button id="restartScreenBtn" class="btn btn-primary" style="margin-top:1rem;">🔄 Пройти заново</button>
                </div>
            `;
            appDiv.innerHTML = finalHtml;
            document.getElementById("restartScreenBtn")?.addEventListener("click", () => startScreenMode());
            return;
        }

        const q = QUESTIONS[currentIndex];
        const selectedIdx = userAnswers[currentIndex];
        const alreadyAnswered = answered[currentIndex];

        let optionsHtml = "";
        const letters = ['А', 'Б', 'В', 'Г'];
        q.options.forEach((opt, idx) => {
            let additionalClass = "";
            if (alreadyAnswered) {
                additionalClass = (idx === q.correct) ? "correct-feedback" : (idx === selectedIdx && idx !== q.correct) ? "wrong-feedback" : "";
                if (additionalClass) additionalClass += " disabled";
                else additionalClass = "disabled";
            } else {
                additionalClass = "";
            }
            optionsHtml += `<button class="option-btn ${additionalClass}" data-opt="${idx}"><strong>${letters[idx]}</strong> ${escapeHtml(opt)}</button>`;
        });

        let feedbackHtml = "";
        if (alreadyAnswered) {
            const isCorrect = answerStatus[currentIndex];
            const correctAnswer = q.options[q.correct];
            feedbackHtml = `
                <div class="feedback ${isCorrect ? 'correct-feedback' : 'wrong-feedback'}">
                    ${isCorrect ? '✅ Верно!' : `❌ Неверно. Правильный ответ: ${correctAnswer}`}
                    <div style="margin-top:6px;">💡 ${q.hint}</div>
                </div>
            `;
        }

        const answeredCount = answered.filter(a => a === true).length;
        const progressPercent = Math.round(answeredCount / TOTAL * 100);
        const isLast = (currentIndex === TOTAL - 1);
        const nextText = isLast ? "🏁 Завершить" : "Следующий →";

        const html = `
            <div class="glass-card">
                <div class="quiz-question">
                    <div class="question-header">
                        <span class="q-num">Вопрос ${currentIndex+1} / ${TOTAL}</span>
                        <span class="q-type">📖 Данте · «Божественная комедия»</span>
                    </div>
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    <div class="options" id="optionsArea">${optionsHtml}</div>
                    ${feedbackHtml}
                    <div class="nav-buttons">
                        <button id="prevBtn" class="btn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="nextBtn" class="btn btn-primary">${nextText}</button>
                    </div>
                    <div class="progress">✅ Отвечено: ${answeredCount} / ${TOTAL} (${progressPercent}%)</div>
                </div>
            </div>
        `;

        appDiv.innerHTML = html;

        if (!alreadyAnswered) {
            document.querySelectorAll('.option-btn:not(.disabled)').forEach(btn => {
                const optIdx = parseInt(btn.dataset.opt);
                btn.addEventListener('click', () => {
                    if (!answered[currentIndex] && !quizFinished) onSelectOption_Screen(optIdx);
                });
            });
        }

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => {
            if (!quizFinished && currentIndex > 0) {
                currentIndex--;
                renderScreenQuestion();
            }
        });
        if (nextBtn) nextBtn.addEventListener('click', () => {
            if (quizFinished) return;
            if (currentIndex === TOTAL - 1) {
                finishScreenQuiz();
            } else {
                if (!answered[currentIndex]) return;
                currentIndex++;
                renderScreenQuestion();
            }
        });
    }

    function finishScreenQuiz() {
        if (quizFinished) return;
        for (let i = 0; i < TOTAL; i++) {
            if (userAnswers[i] !== null) evaluateQuestion(i);
            else answerStatus[i] = false;
        }
        quizFinished = true;
        renderScreenQuestion();
    }

    function startScreenMode() {
        mode = 'screen';
        quizFinished = false;
        currentIndex = 0;
        userAnswers = new Array(TOTAL).fill(null);
        answerStatus = new Array(TOTAL).fill(false);
        answered = new Array(TOTAL).fill(false);
        updateScoreUI();
        renderScreenQuestion();
    }

    // ========== РЕЖИМ "НА ЛИСТОЧКЕ" ==========
    let paperCurrentIndex = 0;

    function renderPaperQuestion() {
        if (paperFinished) {
            let listHtml = `<div class="glass-card"><div class="question-text">📝 Вопросы для самопроверки (на листочке)</div><div class="final-list" style="max-height:500px; overflow-y:auto;">`;
            QUESTIONS.forEach((q, idx) => {
                const letters = ['А', 'Б', 'В', 'Г'];
                const optionsStr = q.options.map((opt, i) => `${letters[i]}) ${escapeHtml(opt)}`).join(' · ');
                listHtml += `<div style="padding:0.6rem; border-bottom:1px solid rgba(255,215,150,0.1);"><strong>${idx+1}. ${escapeHtml(q.text)}</strong><br><span style="opacity:0.6;">${optionsStr}</span></div>`;
            });
            listHtml += `</div><div class="nav-buttons" style="justify-content:center; margin-top:1rem;"><button id="restartPaperBtn" class="btn btn-primary">🔄 Выбрать режим заново</button></div></div>`;
            appDiv.innerHTML = listHtml;
            document.getElementById("restartPaperBtn")?.addEventListener("click", () => showModeSelection());
            return;
        }

        const q = QUESTIONS[paperCurrentIndex];
        const letters = ['А', 'Б', 'В', 'Г'];
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            optionsHtml += `<div class="option-btn" style="cursor:default; background:rgba(255,255,255,0.02);"><strong>${letters[idx]}</strong> ${escapeHtml(opt)}</div>`;
        });

        const isLast = (paperCurrentIndex === TOTAL - 1);
        const html = `
            <div class="glass-card">
                <div class="quiz-question">
                    <div class="question-header">
                        <span class="q-num">Вопрос ${paperCurrentIndex+1} / ${TOTAL}</span>
                        <span class="q-type">📄 Режим «На листочке»</span>
                    </div>
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="nav-buttons">
                        <button id="paperPrevBtn" class="btn" ${paperCurrentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="paperNextBtn" class="btn btn-primary">${isLast ? '🏁 Завершить' : 'Следующий →'}</button>
                    </div>
                    <div class="progress">📌 Запишите ответ на листочек</div>
                </div>
            </div>
        `;
        appDiv.innerHTML = html;

        const prevBtn = document.getElementById('paperPrevBtn');
        const nextBtn = document.getElementById('paperNextBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => {
            if (paperCurrentIndex > 0) {
                paperCurrentIndex--;
                renderPaperQuestion();
            }
        });
        if (nextBtn) nextBtn.addEventListener('click', () => {
            if (isLast) {
                paperFinished = true;
                renderPaperQuestion();
            } else {
                paperCurrentIndex++;
                renderPaperQuestion();
            }
        });
    }

    function startPaperMode() {
        mode = 'paper';
        paperCurrentIndex = 0;
        paperFinished = false;
        renderPaperQuestion();
    }

    // ========== ЭКРАН ВЫБОРА РЕЖИМА ==========
    function showModeSelection() {
        mode = null;
        const html = `
            <div class="glass-card mode-screen">
                <div>
                    <div class="mode-title" style="font-size:1.6rem; font-weight:700;">📜 «Божественная комедия»</div>
                    <div style="margin-top:0.5rem; opacity:0.7;">Данте Алигьери · 20 вопросов · Ад, Чистилище, Рай</div>
                </div>
                <div class="mode-buttons">
                    <button class="mode-btn btn" id="screenModeBtn">🖥️ На экране<br><small>выбор ответа, подсветка, баллы</small></button>
                    <button class="mode-btn btn" id="paperModeBtn" style="background:#4a2a5a;">📄 На листочке<br><small>просто вопросы, ответы записываете отдельно</small></button>
                </div>
                <div class="mode-desc" style="margin-top: 1rem; font-size:0.85rem;">✔️ В режиме «На листочке» вы не выбираете ответ на экране — только читаете вопрос и варианты, а ответ пишете на бумаге.</div>
            </div>
        `;
        appDiv.innerHTML = html;
        document.getElementById("screenModeBtn")?.addEventListener("click", startScreenMode);
        document.getElementById("paperModeBtn")?.addEventListener("click", startPaperMode);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    showModeSelection();
</script>
</body>
</html>
